<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" />
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/style-light.css">
    <link rel="stylesheet" href="./css/style-pink.css">
    <link rel="stylesheet" href="./css/style-blue.css">
    <link rel="stylesheet" href="./css/style-green.css">
    <title>Chat | Iltemberg</title>
    <link rel="icon" type="image/png" href="./images/favicon.png">
</head>
<body>

    <section class="container">

        <!-- ================= TELA DE LOGIN / CADASTRO ================= -->
        <section class="login">
            <h2 id="form-title">Login</h2>

            <!-- Botão de Troca de Tema -->
            <button type="button" id="manual-theme-toggle" class="theme-toggle-btn" aria-label="Mudar tema">🌙</button>

            <form class="login__form" id="auth-form">
                <!-- Nome de exibição -->
                <input type="text" class="login__input" id="username" placeholder="Seu nome de usuário (ex: joao)" required />
                
                <!-- E-mail -->
                <input type="email" class="login__input" id="email" placeholder="Seu e-mail" required />
                
                <!-- Senha -->
                <input type="password" class="login__input" id="password" placeholder="Sua senha" required />
                
                <button type="submit" class="login__button" id="submit-btn">Entrar</button>
            </form>
            
            <p class="login__toggle" id="forgot-password-container" style="margin-bottom: 10px;">
                <a href="#" id="forgot-password" style="color: #aaa; font-size: 0.8rem;">Esqueci minha senha</a>
            </p>

            <p class="login__toggle">
                <span id="toggle-msg">Não tem conta?</span> 
                <a href="#" id="toggle-auth">Cadastre-se</a>
            </p>

        </section>

        <!-- ================= TELA DO CHAT ================= -->
        <section class="chat">
            
            <div class="chat__header">
                <div class="chat__header-scroll">

                    <!-- Botão de Tema dentro do Chat -->
                    <button type="button" id="chat-theme-toggle" class="chat-theme-btn" aria-label="Mudar tema">🌙</button>
                    <button id="btn-som" class="btn-som" title="Som ligado/desligado">🔊</button>
                    <div id="admin-bar" style="display: none;">
                        <button id="btn-clear-all" class="btn-admin">Limpar Tudo</button>
                        <button id="btn-manage-bans" class="btn-admin" style="background-color: #8e44ad;">Gerenciar Banidos</button>
                    </div>
                    <button id="btn-edit-name" class="btn-edit-name" style="display: none;">✏️ Editar Nome</button>
                    <button id="btn-edit-email" class="btn-edit-name" style="display: none;">📧 Alterar E-mail</button>
                    <button id="btn-logout" class="btn-logout">Sair</button>
                </div>
            </div>

            <!-- 🔑 FIXAR: Barra de mensagem fixada (Fora do header) -->
            <div id="pinned-message-bar" class="pinned-message-bar" style="display: none;">
                <span class="material-symbols-outlined" style="font-size: 1.2rem; margin-right: 8px;">push_pin</span>
                <div class="pinned-message-text" id="pinned-text"></div>
                <button type="button" id="btn-unpin" class="btn-unpin" title="Desafixar mensagem">&times;</button>
            </div>

            <aside class="chat__sidebar">
                <h3>Usuários (<span id="online-count">0</span>)</h3>
                <ul id="online-list"></ul>
            </aside>

            <section class="chat__messages"></section>

            <div class="chat__stickers" id="stickers-bar">
                <button type="button" class="sticker-btn" data-emoji="./emojis/coracao.gif"><img src="./emojis/coracao.gif" alt="Coração"></button>
                <button type="button" class="sticker-btn" data-emoji="./emojis/sorriso.gif"><img src="./emojis/sorriso.gif" alt="Sorriso"></button>
                <button type="button" class="sticker-btn" data-emoji="./emojis/fogo.gif"><img src="./emojis/fogo.gif" alt="Fogo"></button>
                <button type="button" class="sticker-btn" data-emoji="./emojis/rindo.gif"><img src="./emojis/rindo.gif" alt="Rindo"></button>
            </div>

            <form class="chat__form">
                <button type="button" class="chat__button-gif" id="btn-gif-keyboard" title="Mostrar/Esconder Emoticons">
                    <span class="material-symbols-outlined">gif_box</span>
                </button>
                <input type="text" class="chat__input" id="chat-input" placeholder="Digite uma mensagem..." required />
                <button type="submit" class="chat__button">
                    <span class="material-symbols-outlined">send</span>
                </button>
            </form>

        </section>

    </section>

    <!-- ================= MODAL DE BANIDOS ================= -->
    <div id="bans-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" id="close-bans-modal">&times;</span>
            <h2>Usuários Banidos</h2>
            <ul id="bans-list" style="margin-top: 20px; list-style: none;"></ul>
        </div>
    </div>

    <script type="module" src="./js/script.js"></script>
    <script src="./js/script-light.js"></script>
    <script src="./js/script-temas.js"></script> 
</body>
</html>
